name: Auto Redis Version Check

on:
  schedule:
    # Run monthly on the 1st day at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  check-redis-versions:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh

      - name: Get Redis Latest Versions
        id: redis-versions
        run: |
          echo "Fetching Redis latest 5 stable versions..."
          redis_versions=$(curl -s "https://api.github.com/repos/redis/redis/releases?per_page=5" | \
            jq -r '.[].tag_name' | \
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | \
            sed 's/^/v/' | \
            sort -V)
          
          echo "Redis latest versions:"
          echo "$redis_versions"
          
          # Save to environment variable
          echo "REDIS_VERSIONS<<EOF" >> $GITHUB_ENV
          echo "$redis_versions" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get Redis Exporter Latest Versions
        id: redis-exporter-versions
        run: |
          echo "Fetching Redis Exporter latest 5 stable versions..."
          exporter_versions=$(curl -s "https://api.github.com/repos/oliver006/redis_exporter/releases?per_page=5" | \
            jq -r '.[].tag_name' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -V)

          echo "Redis Exporter latest versions:"
          echo "$exporter_versions"

          # Save to environment variable
          echo "EXPORTER_VERSIONS<<EOF" >> $GITHUB_ENV
          echo "$exporter_versions" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get Built Versions from Quay.io
        id: built-versions
        run: |
          echo "Fetching built versions from Quay.io..."
          built_versions=$(curl -s "https://quay.io/api/v1/repository/opstree/redis/tag/" | \
            jq -r '.tags[].name' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -V)
          
          echo "Built versions:"
          echo "$built_versions"
          
          # Save to environment variable
          echo "BUILT_VERSIONS<<EOF" >> $GITHUB_ENV
          echo "$built_versions" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Get Built Redis Exporter Versions from Quay.io
        id: built-exporter-versions
        run: |
          echo "Fetching built Redis Exporter versions from Quay.io..."
          built_exporter_versions=$(curl -s "https://quay.io/api/v1/repository/opstree/redis-exporter/tag/" | \
            jq -r '.tags[].name' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | \
            sort -V)

          echo "Built Redis Exporter versions:"
          echo "$built_exporter_versions"

          # Save to environment variable
          echo "BUILT_EXPORTER_VERSIONS<<EOF" >> $GITHUB_ENV
          echo "$built_exporter_versions" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check for New Versions
        id: check-versions
        run: |
          echo "Checking for new versions to build..."
          
          new_versions=""
          while IFS= read -r version; do
            if [[ -n "$version" ]]; then
              if ! echo "$BUILT_VERSIONS" | grep -q "^$version$"; then
                echo "Found new version: $version"
                new_versions="$new_versions $version"
              else
                echo "Version $version already exists"
              fi
            fi
          done <<< "$REDIS_VERSIONS"
          
          if [[ -n "$new_versions" ]]; then
            echo "Versions to build:$new_versions"
            echo "NEW_VERSIONS=$new_versions" >> $GITHUB_ENV
            echo "HAS_NEW_VERSIONS=true" >> $GITHUB_ENV
          else
            echo "No new versions found"
            echo "HAS_NEW_VERSIONS=false" >> $GITHUB_ENV
          fi

      - name: Check for New Redis Exporter Versions
        id: check-exporter-versions
        run: |
          echo "Checking for new Redis Exporter versions to build..."

          new_exporter_versions=""
          while IFS= read -r version; do
            if [[ -n "$version" ]]; then
              if ! echo "$BUILT_EXPORTER_VERSIONS" | grep -q "^$version$"; then
                echo "Found new Redis Exporter version: $version"
                new_exporter_versions="$new_exporter_versions $version"
              else
                echo "Redis Exporter version $version already exists"
              fi
            fi
          done <<< "$EXPORTER_VERSIONS"

          if [[ -n "$new_exporter_versions" ]]; then
            echo "Redis Exporter versions to build:$new_exporter_versions"
            echo "NEW_EXPORTER_VERSIONS=$new_exporter_versions" >> $GITHUB_ENV
            echo "HAS_NEW_EXPORTER_VERSIONS=true" >> $GITHUB_ENV
          else
            echo "No new Redis Exporter versions found"
            echo "HAS_NEW_EXPORTER_VERSIONS=false" >> $GITHUB_ENV
          fi

      - name: Trigger Redis Builds
        if: env.HAS_NEW_VERSIONS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting to trigger builds..."
          
          for version in $NEW_VERSIONS; do
            if [[ -n "$version" ]]; then
              echo "Triggering build for version: $version"
              
              # Trigger Redis build
              echo "Building Redis $version..."
              gh workflow run manual-release.yaml \
                -f component=redis \
                -f version=$version
              
              # Trigger Redis Sentinel build
              echo "Building Redis Sentinel $version..."
              gh workflow run manual-release.yaml \
                -f component=sentinel \
                -f version=$version
              
              # Wait to avoid too frequent API calls
              sleep 5
            fi
          done
          
          echo "All build tasks have been triggered"

      - name: Trigger Redis Exporter Builds
        if: env.HAS_NEW_EXPORTER_VERSIONS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting to trigger Redis Exporter builds..."

          for version in $NEW_EXPORTER_VERSIONS; do
            if [[ -n "$version" ]]; then
              echo "Triggering build for Redis Exporter version: $version"

              # Trigger Redis Exporter build
              echo "Building Redis Exporter $version..."
              gh workflow run manual-release.yaml \
                -f component=exporter \
                -f version=$version

              # Wait to avoid too frequent API calls
              sleep 5
            fi
          done

          echo "All Redis Exporter build tasks have been triggered"

      - name: Summary
        run: |
          echo "## Redis Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "### Redis Latest Versions:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$REDIS_VERSIONS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "### Built Versions:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BUILT_VERSIONS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [[ "$HAS_NEW_VERSIONS" == "true" ]]; then
            echo "### Triggered Builds for New Versions:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$NEW_VERSIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Result: No new versions found to build" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Redis Exporter Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "### Redis Exporter Latest Versions:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$EXPORTER_VERSIONS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Built Redis Exporter Versions:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BUILT_EXPORTER_VERSIONS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          if [[ "$HAS_NEW_EXPORTER_VERSIONS" == "true" ]]; then
            echo "### Triggered Redis Exporter Builds for New Versions:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "$NEW_EXPORTER_VERSIONS" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "### Result: No new Redis Exporter versions found to build" >> $GITHUB_STEP_SUMMARY
          fi
