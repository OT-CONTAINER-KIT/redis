name: Manual Docker Image Release

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Select component to release'
        required: true
        type: choice
        options:
          - redis
          - sentinel
          - exporter
      version:
        description: 'Input version to release (e.g. v1.0.0)'
        required: true
        type: string
      tag_latest:
        description: 'Also move the latest tag to this version'
        required: false
        type: boolean
        default: true

run-name: "Building ${{ github.event.inputs.component }} ${{ github.event.inputs.version }}"

jobs:
  build_and_push:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Login to Quay
        uses: docker/login-action@v2
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      
      - name: Set build configuration
        id: config
        run: |
          if [ "${{ github.event.inputs.component }}" = "redis" ]; then
            dockerfile="Dockerfile"
            image_name="redis"
            build_arg_name="REDIS_VERSION"
          elif [ "${{ github.event.inputs.component }}" = "sentinel" ]; then
            dockerfile="Dockerfile.sentinel"
            image_name="redis-sentinel"
            build_arg_name="REDIS_SENTINEL_VERSION"
          else
            dockerfile="Dockerfile.exporter"
            image_name="redis-exporter"
            build_arg_name="REDIS_EXPORTER_VERSION"
          fi

          # Boolean inputs arrive as the strings "true"/"false"; anything but
          # an explicit "false" keeps the historical tag-latest behavior.
          tags="quay.io/opstree/${image_name}:${{ github.event.inputs.version }}"
          if [ "${{ github.event.inputs.tag_latest }}" != "false" ]; then
            tags="${tags},quay.io/opstree/${image_name}:latest"
          fi

          echo "dockerfile=$dockerfile" >> $GITHUB_OUTPUT
          echo "image_name=$image_name" >> $GITHUB_OUTPUT
          echo "build_arg_name=$build_arg_name" >> $GITHUB_OUTPUT
          echo "tags=$tags" >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ${{ steps.config.outputs.build_arg_name }}=${{ github.event.inputs.version }}
          tags: ${{ steps.config.outputs.tags }}
